# Coturn config cho VPS
# Lưu ý: service coturn trong docker-compose.yml dùng network_mode: host
# → chỉ hoạt động trên Linux host. Docker Desktop Windows/Mac KHÔNG hỗ trợ.
#
# <VPS_PUBLIC_IP> sẽ được tự động thay thế bởi biến môi trường VPS_PUBLIC_IP
# khi chạy docker compose --profile turn up -d

# Server settings
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535


# Auth
user=user:password
realm=webrtc.local

# Logging
verbose
log-file=stdout

# Security
no-cli
no-tcp-relay=false
